    <rect x="236" y="338" width="130" height="24" rx="7" fill="#fff" stroke="#d4d4dc"/>
    <text x="301" y="354" font-size="11" text-anchor="middle" fill="#333">↻ Yeniden değerlendir</text>
    <text x="378" y="354" font-size="10.5" fill="#6b6b76">Ayrıntılar: geçmiş puanlar, donanım ▸</text>
  </g>

  <!-- second card (busy) -->
  <rect x="606" y="138" width="372" height="232" rx="12" fill="#fff" stroke="#e2e2e8"/>
  <text x="622" y="164" font-size="14" font-weight="700" fill="#1a1a1a">Işıl Karademir</text>
