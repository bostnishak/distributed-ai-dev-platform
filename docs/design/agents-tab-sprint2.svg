  <g font-size="11" fill="#333">
    <text x="622" y="226">Kodlama</text>
    <rect x="716" y="217" width="190" height="10" rx="5" fill="#eeeef2"/><rect x="716" y="217" width="171" height="10" rx="5" fill="#4f46e5"/>
    <text x="916" y="226">90</text>
    <text x="622" y="246">Akıl yürütme</text>
    <rect x="716" y="237" width="190" height="10" rx="5" fill="#eeeef2"/><rect x="716" y="237" width="133" height="10" rx="5" fill="#4f46e5"/>
    <text x="916" y="246">70</text>
    <text x="622" y="266">Bağlam</text>
    <rect x="716" y="257" width="190" height="10" rx="5" fill="#eeeef2"/><rect x="716" y="257" width="57" height="10" rx="5" fill="#4f46e5"/>
    <text x="916" y="266">30</text>
    <text x="622" y="286">Hız</text>
    <rect x="716" y="277" width="190" height="10" rx="5" fill="#eeeef2"/><rect x="716" y="277" width="76" height="10" rx="5" fill="#4f46e5"/>
    <text x="916" y="286">40</text>
    <text x="622" y="306">JSON</text>
    <rect x="716" y="297" width="190" height="10" rx="5" fill="#eeeef2"/><rect x="716" y="297" width="171" height="10" rx="5" fill="#4f46e5"/>
