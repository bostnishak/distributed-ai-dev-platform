  <text x="908" y="42" font-size="11.5" text-anchor="middle" fill="#333">↻ Tümünü değerlendir</text>

  <!-- summary row -->
  <g font-size="11" fill="#333">
    <rect x="220" y="76" width="160" height="46" rx="8" fill="#e7f6ec"/>
