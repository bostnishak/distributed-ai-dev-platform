  <rect x="622" y="338" width="130" height="24" rx="7" fill="#f3f3f5" stroke="#e2e2e8"/>
  <text x="687" y="354" font-size="11" text-anchor="middle" fill="#9a9aa5">↻ Yeniden değerlendir</text>
  <text x="764" y="354" font-size="10.5" fill="#9a9aa5">meşgulken devre dışı</text>

  <!-- third card (offline) -->
  <rect x="220" y="384" width="372" height="96" rx="12" fill="#fafafb" stroke="#e2e2e8"/>
  <text x="236" y="410" font-size="14" font-weight="700" fill="#6b6b76">Berfin Yiğit</text>
  <text x="236" y="427" font-size="11" fill="#9a9aa5" font-family="Consolas, monospace">uye6 · qwen3:1.7b · bağlam 40.960</text>
  <rect x="490" y="396" width="88" height="20" rx="10" fill="#f3f3f5"/>
  <circle cx="502" cy="406" r="4" fill="#9a9aa5"/>
  <text x="510" y="410" font-size="10.5" fill="#6b6b76">çevrimdışı</text>
  <text x="236" y="450" font-size="10.5" fill="#6b6b76">Son sinyal: 12 dk önce · görev atanmaz</text>
  <text x="236" y="468" font-size="10.5" fill="#6b6b76">Puanlar soluk gösterilir (son ölçüm 8 Eki)</text>

  <!-- annotations -->
  <g font-size="11" fill="#b45309">
    <text x="606" y="404">① Rozet: PB-20 heartbeat'ten gelir (≈10 sn); 3 sinyal kaçarsa çevrimdışı.</text>
    <text x="606" y="424">② Çubuklar: PB-22'nin 0–100 puanları; renk tek (erişilebilir, sayı yanında).</text>
    <text x="606" y="444">③ "Yeniden değerlendir": POST /api/agents/{id}/evaluate; meşgulken kapalı.</text>
    <text x="606" y="464">④ Mobilde kartlar tek sütun; çubuk etiketleri üstte.</text>
  </g>
  <text x="220" y="620" font-size="10.5" fill="#9a9aa5">Taslak · Sprint 2 (PB-26) · Puanlar örnek değerdir, ölçüm değildir.</text>
