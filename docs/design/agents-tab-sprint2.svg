      <text x="236" y="286">Hız</text>
      <rect x="330" y="277" width="190" height="10" rx="5" fill="#eeeef2"/><rect x="330" y="277" width="95" height="10" rx="5" fill="#4f46e5"/>
      <text x="530" y="286">50</text>
      <text x="236" y="306">JSON</text>
      <rect x="330" y="297" width="190" height="10" rx="5" fill="#eeeef2"/><rect x="330" y="297" width="171" height="10" rx="5" fill="#4f46e5"/>
