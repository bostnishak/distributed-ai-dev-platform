# Runs only the LiteLLM gateway. Normally the root docker-compose.yml starts it together
# with the master; this file is for debugging the gateway on its own.
services:
  litellm-gateway:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - ../.env
    extra_hosts:
      # Needed for host.docker.internal on Linux Docker; Docker Desktop provides it anyway.
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml"]
