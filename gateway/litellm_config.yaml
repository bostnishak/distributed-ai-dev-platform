# LiteLLM gateway configuration. It serves only the Assistant tab; the platform's own agents
# talk to their local Ollama directly. The gateway is removed in Sprint 3 (PB-37), when the
# Assistant moves onto the agent infrastructure.
#
# Data privacy: everything runs locally. No cloud or external LLM API is used.
#
# All six models currently run on the master's computer (staging), reached from Docker through
# host.docker.internal. Model-specific notes verified on 2026-09-24/25:
# - "think" passes through the gateway unchanged (think:false ~1.7 s, think:true ~37 s).
# - qwen2.5-coder:7b does not support thinking; think:true returns HTTP 400.

model_list:
  - model_name: uye1-qwen          # İshak Bostan
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: http://host.docker.internal:11434

  - model_name: uye2-phi4mini      # Zeynep Duru Küçük
    litellm_params:
      model: ollama_chat/phi4-mini
      api_base: http://host.docker.internal:11434

  - model_name: uye3-llama         # Furkan Kaan Özbeyli
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://host.docker.internal:11434

  - model_name: uye4-gemma         # Semih Sarıca
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: http://host.docker.internal:11434

  - model_name: uye5-coder         # Işıl Karademir (no thinking support)
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434

  - model_name: uye6-qwen-light    # Berfin Yiğit
    litellm_params:
      model: ollama_chat/qwen3:1.7b
      api_base: http://host.docker.internal:11434
