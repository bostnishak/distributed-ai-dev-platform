[pytest]
markers =
    unit: Hızlı, dış bağımlılıksız birim testleri (OPS-09 / ALT-15)
    contract: OpenAPI şema ve arayüz-API sözleşme testleri (OPS-09 / ALT-15)
    integration: Veritabanı ve çoklu modül bütünleştirme testleri (OPS-09 / ALT-15)
    e2e: Uçtan uca akış ve tarayıcı testleri (OPS-09 / ALT-15)
    slow: Uzun süren veya konteyner/stres testleri (OPS-09 / ALT-15)
    security: SEC-11..SEC-24 security hardening, auth matrix, sandbox, crypto, and redaction tests
