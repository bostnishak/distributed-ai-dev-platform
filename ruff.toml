# Shared lint settings for master/ and agent/. CI runs "ruff check ." inside each folder;
# ruff finds this file by walking up, so local runs and CI use the same rules.
target-version = "py312"
line-length = 120
# The services use flat modules (import db, import config); list their folders so isort
# treats those modules as first-party.
src = ["master", "master/tests", "agent", "agent/tests"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "RUF", "ASYNC"]
# Turkish user-facing text legitimately uses the dotless "ı".
allowed-confusables = ["ı"]
