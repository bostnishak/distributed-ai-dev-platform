<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>DADP Yerel Asistan</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; width: 340px; margin: 12px; color: #0f172a; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  textarea { width: 100%; min-height: 80px; box-sizing: border-box; padding: 6px; }
  button { margin-top: 8px; padding: 8px 12px; background: #4f46e5; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  pre { white-space: pre-wrap; font-size: 12px; background: #f8fafc; padding: 8px; border-radius: 6px; max-height: 220px; overflow: auto; }
</style>
</head>
<body>
  <h1>DADP Yerel Asistan (Onaylı)</h1>
  <label for="extPrompt">Soru veya özet isteği</label>
  <textarea id="extPrompt" aria-label="Soru veya özet isteği" placeholder="Seçili metni özetle..."></textarea>
  <button id="extSendBtn" type="button">Yerel Master'a Gönder</button>
  <pre id="extOut">Hazır (yalnızca http://127.0.0.1:8000 bağlantısı).</pre>
  <script src="popup.js"></script>
</body>
</html>
