# SEC-19: Automated dependency and container base-image security updates
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/master"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/sandbox"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
