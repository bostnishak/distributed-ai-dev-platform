name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly extended eval and load check (OPS-07, OPS-16)
    - cron: "0 2 * * *"

jobs:
  plan-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Master Plan v2 consistency (PROC-09)
        run: python scripts/plan_tool.py check
      - name: Module wiring gate (DEF-01)
        run: python scripts/plan_tool.py wiring --fail-on-new
      - name: Code complexity & function length gate (OPS-20)
        run: python scripts/quality_gate.py

  master:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements.txt pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit & integration tests with coverage (OPS-08, OPS-09)
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Security test suite & route auth matrix (SEC-22)
        run: pytest -m security tests/ -v
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: master-coverage-${{ matrix.python-version }}
          path: master/coverage.xml

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest tests/ -v

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eval dependencies
        run: pip install -r master/requirements.txt
      - name: Fast offline hallucination & grounding eval gate (HAL-05)
        run: python eval/run.py --limit 50 --offline --report eval/reports/ci_latest.json
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/ci_latest.json

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret leak scan (gitleaks, SEC-20)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Block tracked .env files (SEC-20)
        run: |
          tracked=$(git ls-files '.env*' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Forbidden .env file tracked: $tracked"
            exit 1
          fi
      - name: Python dependency audit & SBOM generation (SEC-19, OPS-13)
        run: |
          pip install pip-audit
          pip-audit -r master/requirements.txt --strict --progress-spinner off
          python scripts/generate_sbom.py --output sbom-master.json
      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-master.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose profiles (OPS-06)
        env:
          AGENT_TOKEN: ci-placeholder
        run: |
          cp .env.example .env
          docker compose --profile core config --quiet
          docker compose --profile agents config --quiet
          docker compose --profile staging config --quiet
          docker compose --profile web-search config --quiet
      - name: Build master, agent, and sandbox images
        run: |
          docker build -t dadp-master:ci master
          docker build -t dadp-agent:ci agent
          docker build -t platform-sandbox:ci docker/sandbox
      - name: Master container smoke test (/health & /ready, DEF-14)
        run: |
          docker run -d --name dadp-smoke -p 127.0.0.1:8000:8000 -e AGENT_TOKEN=ci-smoke dadp-master:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              curl -sS -o /dev/null -w "ready_http=%{http_code}\n" http://127.0.0.1:8000/ready
              docker rm -f dadp-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs dadp-smoke
          docker rm -f dadp-smoke
          exit 1
      - name: Trivy container image vulnerability scan (SEC-19)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "dadp-master:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
