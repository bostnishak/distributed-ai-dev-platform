# Distributed AI Software Development Platform (CM6453)
# Hardened Compose stack with profiles (OPS-06, SEC-19, SEC-24, ADR-0001):
#
#   docker compose --profile core up -d --build          master only (in-process LLM gateway, no LiteLLM)
#   docker compose --profile core --profile agents up -d master + uye1 node agent
#   docker compose --profile staging up -d --build       master + staging agents uye2..uye6
#   docker compose --profile web-search up -d            local SearXNG metasearch engine (ADR-0002)
#   docker compose --profile sandbox build               builds isolated Python execution sandbox (ADR-0007)
#   docker compose --profile gpu up -d                   local Ollama GPU service (optional)

x-staging-agent: &staging-agent
  build: ./agent
  profiles: ["staging"]
  restart: unless-stopped
  depends_on:
    master:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-staging-env: &staging-env
  OLLAMA_URL: http://host.docker.internal:11434
  MASTER_URL: http://master:8000
  AGENT_MODE: staging
  AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN must be set in .env}

services:
  master:
    build: ./master
    container_name: dadp-master
    profiles: ["core", "agents", "staging", "web-search", "gpu"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      MASTER_MODEL: ${MASTER_MODEL:-qwen3.5:4b}
      DB_PATH: /data/platform.db
      SEARXNG_URL: http://searxng:8080
      CLOUD_PROVIDERS_ENABLED: "false"
    env_file:
      - .env
    volumes:
      - master-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  agent-uye1:
    build: ./agent
    container_name: dadp-agent-uye1
    profiles: ["agents", "staging"]
    restart: unless-stopped
    depends_on:
      master:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *staging-env
      AGENT_MODE: node
      AGENT_ID: uye1
      MEMBER_NAME: İshak Bostan
      MODEL: qwen3.5:4b

  agent-uye2:
    <<: *staging-agent
    container_name: dadp-agent-uye2
    environment:
      <<: *staging-env
      AGENT_ID: uye2
      MEMBER_NAME: Zeynep Duru Küçük
      MODEL: phi4-mini

  agent-uye3:
    <<: *staging-agent
    container_name: dadp-agent-uye3
    environment:
      <<: *staging-env
      AGENT_ID: uye3
      MEMBER_NAME: Furkan Kaan Özbeyli
      MODEL: llama3.2:3b

  agent-uye4:
    <<: *staging-agent
    container_name: dadp-agent-uye4
    environment:
      <<: *staging-env
      AGENT_ID: uye4
      MEMBER_NAME: Semih Sarıca
      MODEL: gemma4:e4b

  agent-uye5:
    <<: *staging-agent
    container_name: dadp-agent-uye5
    environment:
      <<: *staging-env
      AGENT_ID: uye5
      MEMBER_NAME: Işıl Karademir
      MODEL: qwen2.5-coder:7b

  agent-uye6:
    <<: *staging-agent
    container_name: dadp-agent-uye6
    environment:
      <<: *staging-env
      AGENT_ID: uye6
      MEMBER_NAME: Berfin Yiğit
      MODEL: qwen3:1.7b

  searxng:
    image: searxng/searxng:latest
    container_name: dadp-searxng-json
    profiles: ["web-search"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: dadp-ollama-gpu
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  sandbox-image:
    build: ./docker/sandbox
    image: platform-sandbox:latest
    profiles: ["sandbox"]
    command: ["python", "-c", "print('sandbox-ready')"]

volumes:
  master-data:
  ollama-models:
