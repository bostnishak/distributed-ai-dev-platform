<button id="theme-toggle" type="button" aria-label="Gece / Gündüz modu" style="position:fixed;right:16px;bottom:16px;z-index:1000;padding:10px 16px;border-radius:999px;border:1px solid currentColor;background:inherit;color:inherit;cursor:pointer;font:inherit">Gece / Gündüz</button>
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById("theme-toggle");
  try { var saved = localStorage.getItem("theme"); if (saved) { root.setAttribute("data-theme", saved); } } catch (e) {}
  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
})();
</script>
