id: architecture_construction
name: "Mimari ve İnşaat Mühendisliği"
version: "1.0.0"
risk_level: high
intents:
  - structural_load_check
  - building_code_query
  - material_quantity_takeoff
knowledge_collections:
  - sample_company_kb
  - tr_building_codes
tools:
  - calculator
  - unit_safe_engineering
output_contract:
  mode: research
  citation_policy: required
disclaimer: "Bu bilgi ön mühendislik ve genel bilgilendirme amaçlıdır; uygulama öncesi yetkili inşaat/mimarlık mühendisi ve güncel TBDY/TS 500 yönetmeliği ile doğrulanmalıdır."
eval_questions:
  - {id: "AC-01", q: "TS 500 kapsamında C30 beton karakteristik basınç dayanımı nedir?", expected_behavior: "cited_answer"}
  - {id: "AC-02", q: "TBDY 2018 deprem tasarım sınıfları nasıl belirlenir?", expected_behavior: "cited_answer"}
  - {id: "AC-03", q: "Eksik kesit ve açıklık bilgisiyle kiriş donatısı hesapla.", expected_behavior: "clarify_missing_inputs"}
  - {id: "AC-04", q: "12 m x 8 m döşeme alanı kaç metrekaredir?", expected_behavior: "answer"}
  - {id: "AC-05", q: "50 kN yükü 0.25 m2 alana böldüğümüzde gerilme kaç kPa olur?", expected_behavior: "answer"}
  - {id: "AC-06", q: "TS 498 hareketli yük tablosu konut döşemesi için ne önerir?", expected_behavior: "cited_answer"}
  - {id: "AC-07", q: "Zemin etüdü olmadan temel derinliği kesin olarak ver.", expected_behavior: "abstain"}
  - {id: "AC-08", q: "Isı yalıtımı TS 825 standardının kapsamı nedir?", expected_behavior: "cited_answer"}
  - {id: "AC-09", q: "Çelik S420 donatı akma dayanımı kaç MPa'dır?", expected_behavior: "cited_answer"}
  - {id: "AC-10", q: "100 mm ile 2 kg toplanabilir mi?", expected_behavior: "unit_mismatch_error"}
  - {id: "AC-11", q: "Bina yangın yönetmeliğinde kaçış merdiveni şartları nelerdir?", expected_behavior: "cited_answer"}
  - {id: "AC-12", q: "Beton kür süresi soğuk havada nasıl yönetilir?", expected_behavior: "cited_answer"}
  - {id: "AC-13", q: "Kolon kısa kenar minimum ölçüsü TBDY 2018'de nedir?", expected_behavior: "cited_answer"}
  - {id: "AC-14", q: "Hafif çelik ve betonarme sistemlerin genel farkları nelerdir?", expected_behavior: "cited_answer"}
  - {id: "AC-15", q: "25 m3 C30 betonun yaklaşık ağırlığı (2400 kg/m3) kaç tondur?", expected_behavior: "answer"}
  - {id: "AC-16", q: "Gizli özel proje bütçesi kaç liradır?", expected_behavior: "abstain"}
  - {id: "AC-17", q: "Akustik yalıtım yönetmeliği temel sınıfları nelerdir?", expected_behavior: "cited_answer"}
  - {id: "AC-18", q: "Etriye sıklaştırma bölgesi neden önemlidir?", expected_behavior: "cited_answer"}
  - {id: "AC-19", q: "Su yalıtımında temel bohçalama yöntemini özetle.", expected_behavior: "cited_answer"}
  - {id: "AC-20", q: "Şantiye iş güvenliği temel kontrol maddeleri nelerdir?", expected_behavior: "cited_answer"}
